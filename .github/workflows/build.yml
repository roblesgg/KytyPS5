name: Build KytyPS5 resource and output probes

on:
  workflow_dispatch:
  push:
    branches: [ perf-next-probes ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SCCACHE_GHA_ENABLED: "true"
  KYTY_BUILD_ORIGIN: ${{ github.repository != 'KytyPS5/KytyPS5' && 'Fork' || github.event_name == 'push' && 'Official' || 'Source' }}
  KYTY_BUILD_REPOSITORY: ${{ github.repository }}

permissions:
  contents: read

jobs:
  metadata:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}

    steps:
      - name: Generate release tag
        id: release_tag
        shell: bash
        run: |
          echo "value=KytyPS5-$(date -u +'%Y-%m-%d')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  windows:
    name: Build KytyPS5 (Windows, diagnostic probes)
    needs: metadata
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        fastpath: [0]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify toolchain
        shell: cmd
        run: |
          git --version
          cmake --version
          ninja --version
          clang-cl --version
          glslangValidator --version
          echo Qt6_DIR=%Qt6_DIR%

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build/windows ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_DIRTY_RANGE_FASTPATH=${{ matrix.fastpath }} ^
            -DKYTY_BUILD_ORIGIN=%KYTY_BUILD_ORIGIN% ^
            -DKYTY_BUILD_REPOSITORY=%KYTY_BUILD_REPOSITORY% ^
            -DKYTY_RELEASE_TAG=${{ needs.metadata.outputs.release_tag }} ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Test performance reporter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:/KYTY -Force | Out-Null
          clang-cl /std:c++20 /W4 /WX /EHsc /I src tests/perfStatsSmoke.cpp /Fe:_Build/perf_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:KYTY_RESOURCE_PROBE = '1'
          & ./_Build/perf_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -LiteralPath C:/KYTY/_perf-detail.txt -SimpleMatch '[resource-probe]' -Quiet)) {
            throw 'Resource probe reporter did not emit its diagnostic line.'
          }

      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/windows --target launcher ^
            audio_out2_port_tests pad_haptics_tests controller_settings_tests ime_dialog_tests lru_cache_tests virtual_memory_allocation_tests ^
            shader_recompiler_compute_tests ^
            resource_tracking_tests scalar_provenance_tests shader_cfg_tests ^
            resource_materialization_tests shader_vertex_metadata_tests archive_file_tests avplayer_file_tests ^
            bit_array_tests memory_tracker_tests --parallel

      - name: Test
        shell: cmd
        run: |
          ctest --test-dir _Build/windows --output-on-failure -R "^(audio_out2_port|pad_haptics|controller_settings|ime_dialog|lru_cache|resource_tracking|scalar_provenance|shader_cfg|resource_materialization|shader_vertex_metadata|archive_file|avplayer_file|virtual_memory_allocation|bit_array|memory_tracker)$"

      - name: Test resource semantics with probes enabled
        shell: cmd
        env:
          KYTY_RESOURCE_PROBE: '1'
        run: |
          ctest --test-dir _Build/windows --output-on-failure -R "^(resource_tracking|resource_materialization)$"

      - name: Install
        shell: cmd
        run: |
          cmake --install _Build/windows --prefix _Build/windows/install

      - name: Record experiment variant and preserve matching symbols
        shell: pwsh
        run: |
          @{ commit = '${{ github.sha }}'; upstream = '59183dbfa81ed7efdff6069177fed50de0552725'; dirty_range_fastpath = ${{ matrix.fastpath }}; detailed_timers = $false; resource_probe_available = $true; output_1080_probe_available = $true } |
            ConvertTo-Json | Set-Content _Build/windows/install/experiment.json
          New-Item -ItemType Directory -Path _Build/windows/install/debug -Force | Out-Null
          Copy-Item -LiteralPath _Build/windows/kyty_emulator.pdb -Destination _Build/windows/install/debug -ErrorAction Stop
          $maps = @(Get-ChildItem -Path _Build/windows/kyty_emulator_*.map -File)
          if ($maps.Count -ne 1) { throw 'Expected exactly one emulator linker map.' }
          Copy-Item -LiteralPath $maps[0].FullName -Destination _Build/windows/install/debug -ErrorAction Stop

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-Windows-x64-probes
          path: _Build/windows/install/**
          if-no-files-found: error
